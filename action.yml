name: "Setup Pour"
description: "Install Pour (the Homebrew-compatible package manager that installs in milliseconds) and pour your packages in CI."
author: "Jagadeesh Kumar S"
branding:
  icon: "download-cloud"
  color: "yellow"
inputs:
  packages:
    description: "Formulae and command-line tools to install, space separated (e.g. `jq ffmpeg gh`). On Windows these come from each tool's own build."
    required: false
    default: ""
  casks:
    description: "Apps to install with `pour install --cask`, space separated (macOS apps; the creator's apps on every system)."
    required: false
    default: ""
  version:
    description: "Pour version (`latest` or `0.1.0`)."
    required: false
    default: "latest"
  prefix:
    description: "Pour prefix. Default /opt/pour on macOS and Linux runners."
    required: false
    default: ""
  brewfile:
    description: "Path to a Brewfile to install with `pour bundle`."
    required: false
    default: ""
outputs:
  prefix:
    description: "The prefix Pour used."
    value: ${{ steps.setup.outputs.prefix }}
  version:
    description: "Installed Pour version."
    value: ${{ steps.setup.outputs.version }}
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PREFIX: ${{ inputs.prefix }}
      run: bash "$GITHUB_ACTION_PATH/scripts/ci.sh" setup
    - shell: bash
      if: inputs.packages != ''
      run: bash "$GITHUB_ACTION_PATH/scripts/ci.sh" install "${{ inputs.packages }}"
    - shell: bash
      if: inputs.casks != ''
      run: bash "$GITHUB_ACTION_PATH/scripts/ci.sh" cask "${{ inputs.casks }}"
    - shell: bash
      if: inputs.brewfile != ''
      run: bash "$GITHUB_ACTION_PATH/scripts/ci.sh" bundle "${{ inputs.brewfile }}"
    - shell: bash
      if: always()
      run: bash "$GITHUB_ACTION_PATH/scripts/ci.sh" summary
