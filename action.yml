name: "Setup Pour"
description: "Install Pour (the Homebrew-compatible package manager that installs in milliseconds) and pour your packages in CI."
author: "Jagadeesh Kumar S"
branding:
  icon: "download-cloud"
  color: "yellow"
inputs:
  packages:
    description: "Formulae to install, space separated (e.g. `jq ffmpeg wget`)."
    required: false
    default: ""
  casks:
    description: "Casks (macOS apps) to install, space separated."
    required: false
    default: ""
  version:
    description: "Pour version (`latest` or `0.1.0`)."
    required: false
    default: "latest"
  prefix:
    description: "Pour prefix. Default /opt/pour on macOS and Linux runners."
    required: false
    default: ""
  brewfile:
    description: "Path to a Brewfile to install with `pour bundle`."
    required: false
    default: ""
outputs:
  prefix:
    description: "The prefix Pour used."
    value: ${{ steps.setup.outputs.prefix }}
  version:
    description: "Installed Pour version."
    value: ${{ steps.setup.outputs.version }}
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      run: |
        set -euo pipefail
        os=$(uname -s); arch=$(uname -m)
        case "$os" in Darwin) os=macos;; Linux) os=linux;; MINGW*|MSYS*) os=windows;; *) echo "unsupported $os"; exit 1;; esac
        case "$arch" in arm64|aarch64) arch=arm64;; x86_64|amd64) arch=x86_64;; esac
        asset="pour-$os-$arch"; [ "$os" = windows ] && asset="$asset.exe"
        ver="${{ inputs.version }}"
        if [ "$ver" = latest ]; then url="https://ipconfig.co.network/pour/dl/$asset"; alt="https://github.com/JKS-sys/pour-13-Oct-2026/releases/latest/download/$asset"; else url="https://ipconfig.co.network/pour/dl/v$ver/$asset"; alt="https://github.com/JKS-sys/pour-13-Oct-2026/releases/download/v$ver/$asset"; fi
        prefix="${{ inputs.prefix }}"
        if [ -z "$prefix" ]; then if [ "$os" = windows ]; then prefix="$RUNNER_TEMP/pour"; else prefix=/opt/pour; fi; fi
        if [ "$os" != windows ]; then sudo mkdir -p "$prefix" && sudo chown -R "$(id -un)" "$prefix"; else mkdir -p "$prefix"; fi
        mkdir -p "$prefix/bin"
        curl -fsL --retry 3 -o "$prefix/bin/pour" "$url" || curl -fsSL --retry 3 -o "$prefix/bin/pour" "$alt"
        chmod +x "$prefix/bin/pour"
        echo "$prefix/bin" >> "$GITHUB_PATH"
        echo "POUR_PREFIX=$prefix" >> "$GITHUB_ENV"
        export POUR_PREFIX="$prefix"
        "$prefix/bin/pour" update
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "version=$("$prefix/bin/pour" --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - shell: bash
      if: inputs.packages != ''
      run: pour install ${{ inputs.packages }}
    - shell: bash
      if: inputs.casks != ''
      run: pour install --cask ${{ inputs.casks }}
    - shell: bash
      if: inputs.brewfile != ''
      run: pour bundle install --file "${{ inputs.brewfile }}"
