name: Test the action
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 5 * * 1"
jobs:
  use:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          packages: jq
      - run: jq --version && pour list
